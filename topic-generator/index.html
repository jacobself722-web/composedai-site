<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Topic Generator by ComposedAI</title>
<meta name="description" content="A free random topic generator for speaking practice. Spin, get a prompt, and talk about it for one minute.">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta property="og:title" content="Random Topic Generator by ComposedAI">
<meta property="og:description" content="Spin, get a prompt, and talk about it for one minute.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://composedai.app/topic-generator/">
<meta property="og:image" content="https://composedai.app/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://composedai.app/assets/og.png">
<link rel="icon" href="../assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
<style>
  :root {
    --accent: #4B44C0;
    --accent-deep: #38339A;
    --ink: #1A1729;
    --ink2: #4D4D66;
    --ink3: #80809C;
    --line: rgba(75, 68, 192, 0.22);
    --rec-red: #FF4D54;
    --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(180deg, #E9EAF4 0%, #F2F3F8 100%);
    -webkit-font-smoothing: antialiased;
  }
  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 20px 46px;
    text-align: center;
  }
  .topBar {
    width: 100%;
    max-width: 1240px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 4px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .brand img { width: 40px; height: 40px; border-radius: 11px; }
  .backHome {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink2);
    font-size: 16px;
    font-weight: 700;
  }
  .backHome:hover { color: var(--ink); }
  .topRight { display: flex; align-items: center; gap: 20px; }
  .getAppBtn {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border: 1.5px solid var(--accent-deep);
    box-shadow: 0 3px 0 var(--accent-deep);
    border-radius: 999px;
    padding: 11px 22px;
    text-decoration: none;
  }
  .getAppBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
  .getAppBtn:hover { background: #574FD0; }
  @media (max-width: 560px) {
    .brand { font-size: 18px; }
    .brand img { width: 32px; height: 32px; border-radius: 9px; }
    .backHome { font-size: 14px; }
    .backHome .bhText { display: none; }
    .topRight { gap: 12px; }
    .getAppBtn { font-size: 14px; padding: 9px 16px; }
  }
  .middle {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    width: 100%;
    max-width: 980px;
    margin-top: 26px;
  }
  .modeToggle {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(255, 255, 255, 0.6);
    border: 1.5px solid #E3E1EE;
    border-radius: 999px;
    padding: 5px;
    margin-bottom: 2px;
  }
  .modeToggle .slider {
    position: absolute;
    top: 5px;
    bottom: 5px;
    border-radius: 999px;
    background: var(--accent);
    transition: left 0.28s cubic-bezier(0.34, 1.3, 0.5, 1), width 0.28s cubic-bezier(0.34, 1.3, 0.5, 1);
    z-index: 0;
  }
  .modeToggle button {
    position: relative;
    z-index: 1;
    font-family: var(--font);
    font-size: 15.5px;
    font-weight: 800;
    color: var(--ink2);
    background: none;
    border: none;
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s ease;
  }
  .modeToggle button.on { color: #fff; }
  .modeToggle button:not(.on):hover { color: var(--ink); }
  @media (max-width: 520px) {
    .modeToggle button { font-size: 14px; padding: 9px 14px; }
  }
  .catWrap { position: relative; margin-bottom: 4px; }
  #catBtn {
    font-family: var(--font);
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink2);
    background: rgba(255, 255, 255, 0.8);
    border: 1.5px solid #E3E1EE;
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  #catBtn:hover:not(:disabled) { border-color: var(--accent); color: var(--ink); }
  #catBtn:disabled { opacity: 0.45; cursor: default; }
  #catBtn .chev { transition: transform 0.18s ease; }
  .catWrap.open #catBtn .chev { transform: rotate(180deg); }
  #catMenu {
    display: none;
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    border: 1.5px solid #E3E1EE;
    border-radius: 18px;
    box-shadow: 0 14px 40px rgba(26, 23, 41, 0.14);
    padding: 8px;
    min-width: 248px;
    max-height: min(440px, 62vh);
    overflow-y: auto;
    z-index: 20;
  }
  .catWrap.open #catMenu { display: block; animation: menuIn 0.16s ease-out; }
  @keyframes menuIn {
    0% { opacity: 0; transform: translateX(-50%) translateY(-5px) scale(0.98); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
  }
  #catMenu button {
    font-family: var(--font);
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    text-align: left;
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    background: none;
    border: none;
    border-radius: 12px;
    padding: 11px 13px;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  #catMenu button .ico { font-size: 17px; width: 24px; text-align: center; flex: 0 0 24px; }
  #catMenu button:hover { background: rgba(75, 68, 192, 0.07); }
  #catMenu button.sel { background: rgba(75, 68, 192, 0.12); }
  .status {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--accent);
    text-transform: uppercase;
    min-height: 48px;
    display: flex;
    align-items: center;
    transition: color 0.3s ease;
  }
  .status.counting {
    font-size: 40px;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .status.warn { color: var(--rec-red); }
  #topicWord {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 7vw, 92px);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.08;
    max-width: 940px;
    text-wrap: balance;
    min-height: 2.2em;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #topicWord.slot { animation: slotIn 0.16s ease-out; }
  @keyframes slotIn {
    0% { opacity: 0.2; transform: translateY(18px); }
    100% { opacity: 1; transform: none; }
  }
  #topicWord.pop { animation: pop 0.35s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.045); }
    100% { transform: scale(1); }
  }
  #topicWord.landIn { animation: landIn 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes landIn {
    0% { opacity: 0; transform: scale(0.85); }
    60% { opacity: 1; transform: scale(1.03); }
    100% { opacity: 1; transform: scale(1); }
  }
  .controls {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 30px;
  }
  .controls button {
    font-family: var(--font);
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    border-radius: 18px;
    padding: 17px 30px;
    display: inline-flex;
    align-items: center;
    gap: 11px;
    transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease, box-shadow 0.12s ease;
  }
  .controls button svg { width: 21px; height: 21px; flex: 0 0 auto; }
  .controls button:active { transform: translateY(2px); }
  .controls button:disabled { opacity: 0.45; cursor: default; }
  #spinBtn {
    color: var(--ink);
    background: #fff;
    border: 1.5px solid #E3E1EE;
    box-shadow: 0 3px 0 #E3E1EE;
  }
  #spinBtn:active { box-shadow: 0 1px 0 #E3E1EE; }
  #spinBtn:hover:not(:disabled) { border-color: #D3D0E6; }
  #timerBtn {
    color: #fff;
    background: var(--accent);
    border: 1.5px solid var(--accent-deep);
    box-shadow: 0 3px 0 var(--accent-deep);
  }
  #timerBtn:active { box-shadow: 0 1px 0 var(--accent-deep); }
  #timerBtn:hover:not(:disabled) { background: #574FD0; }
  #gearBtn {
    width: 58px;
    height: 58px;
    padding: 0;
    border-radius: 50%;
    color: var(--ink2);
    background: #fff;
    border: 1.5px solid #E3E1EE;
    box-shadow: 0 3px 0 #E3E1EE;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #gearBtn:active { box-shadow: 0 1px 0 #E3E1EE; }
  #gearBtn:hover:not(:disabled) { border-color: #D3D0E6; color: var(--ink); }
  #gearBtn svg { width: 23px; height: 23px; }
  @media (max-width: 560px) {
    .middle { margin-top: 16px; gap: 16px; }
    #topicWord { min-height: 2em; }
    .controls { margin-top: 20px; gap: 6px; }
    .controls button { font-size: 14.5px; padding: 12px 12px; gap: 6px; }
    .controls button svg { width: 16px; height: 16px; }
    #gearBtn { width: 44px; height: 44px; padding: 0; }
    #gearBtn svg { width: 19px; height: 19px; }
  }

  /* ---------- Invert (settings toggle) ---------- */
  body.inverted { background: #0B0A16; }
  body.inverted .stage {
    background: linear-gradient(180deg, #E9EAF4 0%, #F2F3F8 100%);
  }
  body.inverted .stage,
  body.inverted .overlay,
  body.inverted .researchScreen { filter: invert(1) hue-rotate(180deg); }
  body.inverted img { filter: invert(1) hue-rotate(180deg); }

  /* ---------- Settings modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 23, 41, 0.38);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(26, 23, 41, 0.25);
    width: 100%;
    max-width: 470px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px 28px 26px;
    text-align: left;
  }
  .modal h2 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 6px;
  }
  .modal .sub { font-size: 16px; color: var(--ink3); margin: 0 0 26px; }
  .setRow { margin-bottom: 24px; }
  .setHead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .setHead .lab {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .setHead .val {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    color: var(--ink);
  }
  .modal input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    height: 26px;
    cursor: pointer;
  }
  .rangeEnds {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--ink3);
    margin-top: 2px;
  }
  .setNote { font-size: 15px; color: var(--ink3); margin-top: 8px; }
  .muteRow {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 22px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    user-select: none;
  }
  .muteRow input[type="checkbox"] {
    width: 21px;
    height: 21px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .modalFoot {
    border-top: 1px solid #ECEAF4;
    padding-top: 16px;
  }
  .modalFoot .savedNote { font-size: 15px; color: var(--ink3); margin: 0 0 16px; }
  #doneBtn {
    font-family: var(--font);
    width: 100%;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border: 1.5px solid var(--accent-deep);
    box-shadow: 0 3px 0 var(--accent-deep);
    border-radius: 999px;
    padding: 16px;
    cursor: pointer;
  }
  #doneBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
  #doneBtn:hover { background: #574FD0; }

  /* ---------- Research timer screen ---------- */
  .researchScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #E9EAF4 0%, #F2F3F8 100%);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    text-align: center;
    z-index: 40;
  }
  .researchScreen.open { display: flex; }
  .rsTopic {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    max-width: 90vw;
  }
  .rsLabel {
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: var(--ink3);
  }
  .rsRingWrap {
    position: relative;
    width: min(72vw, 360px);
    aspect-ratio: 1;
    margin: 10px 0;
  }
  .rsRingWrap svg { width: 100%; height: 100%; display: block; }
  .rsRingWrap .track {
    fill: #fff;
    stroke: #E3E1EE;
    stroke-width: 16;
  }
  .rsRingWrap .prog {
    fill: none;
    stroke: var(--accent);
    stroke-width: 16;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
  }
  .rsTime {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(54px, 12vw, 96px);
    font-weight: 500;
    color: var(--accent);
  }
  .rsCaption { font-size: 17px; color: var(--ink2); }
  .rsSub { font-size: 15px; color: var(--ink3); display: none; }
  .researchScreen.done .rsSub { display: block; }
  .researchScreen.done #rsLabel { visibility: hidden; }
  .researchScreen.done .prog { opacity: 0; }
  .rsTime.warn { color: var(--rec-red); }
  .rsBtns {
    display: flex;
    align-items: center;
    gap: 22px;
    margin-top: 8px;
  }
  #rsDone {
    font-family: var(--font);
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    background: var(--accent);
    border: 1.5px solid var(--accent-deep);
    box-shadow: 0 3px 0 var(--accent-deep);
    border-radius: 999px;
    padding: 15px 28px;
    cursor: pointer;
  }
  #rsDone:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
  #rsDone:hover { background: #574FD0; }
  #rsClose {
    font-family: var(--font);
    font-size: 16px;
    font-weight: 700;
    color: var(--ink2);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
  #rsClose:hover { color: var(--ink); }
</style>
</head>
<body>

<div class="stage">
  <div class="topBar">
    <a class="brand" href="../">
      <img src="../assets/icon.png" alt="ComposedAI logo">
      <span>ComposedAI</span>
    </a>
    <div class="topRight">
      <a class="backHome" href="../">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span class="bhText">Back to home</span>
      </a>
      <a class="getAppBtn" href="https://apps.apple.com/us/app/composedai-speaking-coach/id6787477539">Get the app</a>
    </div>
  </div>

  <div class="middle">
    <div class="modeToggle" id="modeToggle">
      <span class="slider" id="modeSlider"></span>
      <button id="modeCuff" class="on">&#x1F3B2; Random topic</button>
      <button id="modeResearch">&#x1F50D; Deep research</button>
    </div>
    <div class="catWrap" id="catWrap">
      <button id="catBtn">
        <span id="catLabel">General</span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div id="catMenu"></div>
    </div>
    <div class="status" id="status">Ready</div>
    <div id="topicWord">Leftovers</div>
  </div>

  <div class="controls">
    <button id="spinBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
      Spin Topics
    </button>
    <button id="timerBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      <span id="timerLabel">Start speaking</span>
    </button>
    <button id="gearBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-label="Settings">
    <h2>Settings</h2>
    <p class="sub">Timer lengths in whole minutes.</p>

    <div class="setRow">
      <div class="setHead">
        <span class="lab">Speech</span>
        <span class="val" id="speechVal">1 min</span>
      </div>
      <input type="range" id="speechRange" min="1" max="10" step="1" value="1">
      <div class="rangeEnds"><span>1 min</span><span>10 min</span></div>
    </div>

    <div class="setRow">
      <div class="setHead">
        <span class="lab">Research</span>
        <span class="val" id="researchVal">10 min</span>
      </div>
      <input type="range" id="researchRange" min="1" max="60" step="1" value="10">
      <div class="rangeEnds"><span>1 min</span><span>60 min</span></div>
      <div class="setNote">Deep research only</div>
    </div>

    <label class="muteRow">
      <input type="checkbox" id="muteCheck">
      Mute sound effects
    </label>

    <label class="muteRow">
      <input type="checkbox" id="invertCheck">
      Invert
    </label>

    <div class="modalFoot">
      <p class="savedNote">Saved for next time.</p>
      <button id="doneBtn">Done</button>
    </div>
  </div>
</div>

<div class="researchScreen" id="researchScreen">
  <div class="rsTopic" id="rsTopic">Topic</div>
  <div class="rsLabel" id="rsLabel">Researching</div>

// ---------- Sounds (WebAudio, gesture-gated) ----------
let audioCtx = null;
function ctx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function click(freq, gain, dur) {
  try {
    const c = ctx(), o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch (e) {}
}
function tickSound() {
  // Soft filtered noise burst (ported from the reference site's tick):
  // 18ms of decaying noise through a randomized 2200-3000Hz bandpass.
  if (settings.muted) return;
  try {
    const c = ctx();
    const t = c.currentTime;
    const dur = 0.018;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const bp = c.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(2200 + Math.random() * 800, t);
    bp.Q.value = 1.2;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.55, t + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp);
    bp.connect(g);
    g.connect(c.destination);
    src.start(t);
    src.stop(t + dur + 0.01);
  } catch (e) {}
}

// One enveloped note into a destination (the reference site's shared helper).
function note(c, freq, at, dur, type, vol, dest) {
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g);
  g.connect(dest);
  o.start(at);
  o.stop(at + dur + 0.02);
}
// Landing sound: fast C-E-G sine arpeggio (exact port of the reference site's
// landing recipe: 3 notes 70ms apart, 0.45s decay, 0.45 master gain).
function landSound() {
  if (settings.muted) return;
  try {
    const c = ctx();
    const t = c.currentTime;
    const master = c.createGain();
    master.gain.value = 0.45;
    master.connect(c.destination);
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const at = t + i * 0.07;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(f, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.28, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.45);
      o.connect(g);
      g.connect(master);
      o.start(at);
      o.stop(at + 0.47);
    });
  } catch (e) {}
}
function doneSound() {
  // Timer-complete fanfare (ported from the reference site): four rising
  // triangle notes 120ms apart, capped with a high sine.
  if (settings.muted) return;
  try {
    const c = ctx();
    const t = c.currentTime;
    const master = c.createGain();
    master.gain.value = 0.5;
    master.connect(c.destination);
    [392, 523.25, 659.25, 784].forEach((f, i) => note(c, f, t + i * 0.12, 0.55, "triangle", 0.32, master));
    note(c, 1046.5, t + 0.55, 0.9, "sine", 0.22, master);
  } catch (e) {}
}

// ---------- The reel ----------
// Long fast flicker (50 swaps from 28ms, growing 3% per step), then a smooth
// deceleration over the last six swaps into the final topic.
function spin(withSound) {
  if (spinning || PROMPTS.length < 2) return;
  spinning = true;
  spinBtn.disabled = true;
  timerBtn.disabled = true;
  catBtn.disabled = true;
  wordEl.classList.remove("pop", "landIn");
  speakLabel();
  setStatus("Drawing...", false, false);
  step(50, 28, withSound);
}

function step(remaining, interval, withSound) {
  let next = promptIndex;
  while (next === promptIndex) next = Math.floor(Math.random() * PROMPTS.length);
  promptIndex = next;

  // Final topic: reveal it with the scale-up animation and the landing sound
  // fired at the exact same moment, then unlock the controls.
  if (remaining <= 1) {
    wordEl.textContent = PROMPTS[promptIndex];
    wordEl.classList.remove("slot", "pop", "landIn");
    wordEl.style.animationDuration = "";
    void wordEl.offsetWidth;
    wordEl.classList.add("landIn");
    if (withSound) landSound();
    setTimeout(land, 320);
    return;
  }

  // Ease each swap's wait and slide duration up through the last swaps
  // so the reel glides into the landing instead of stopping abruptly.
  const DECEL = { 7: 110, 6: 160, 5: 230, 4: 320, 3: 440, 2: 1000 };
  const wait = DECEL[remaining] || interval;
  wordEl.style.animationDuration = Math.max(130, Math.min(wait * 0.85, 380)) + "ms";
  wordEl.textContent = PROMPTS[promptIndex];
  wordEl.classList.remove("slot", "landIn");
  void wordEl.offsetWidth;
  wordEl.classList.add("slot");
  if (withSound) tickSound();
  setTimeout(() => step(remaining - 1, interval * 1.03, withSound), wait);
}

function land() {
  spinning = false;
  spinBtn.disabled = false;
  timerBtn.disabled = false;
  catBtn.disabled = false;
  setStatus("Your topic", false, false);
}

spinBtn.onclick = () => spin(true);

const rsDone = document.getElementById("rsDone");
const rsClose = document.getElementById("rsClose");
const RING_C = 2 * Math.PI * 152;
rsProg.style.strokeDasharray = RING_C;
rsProg.style.strokeDashoffset = RING_C;

let researchTimerId = null;
let researchLeft = 0;
let researchTotal = 0;

function speakLabel() {
  timerLabel.textContent = mode === "research" ? "Start researching" : "Start speaking";
}

let researchPhase = "timing"; // "timing" while researching, "ready" once done

function resetRing() {
  rsProg.style.transition = "none";
  rsProg.style.strokeDashoffset = RING_C;
  void rsProg.getBoundingClientRect();
  rsProg.style.transition = "";
}

function openResearch() {
  researchPhase = "timing";
  researchTotal = settings.researchMin * 60;
  researchLeft = researchTotal;
  researchScreen.classList.remove("done");
  document.getElementById("rsLabel").textContent = "Researching";
  rsTime.classList.remove("warn");
  rsTopic.textContent = PROMPTS[promptIndex];
  rsTime.textContent = fmt(researchLeft);
  document.getElementById("rsCaption").textContent = "Research.";
  rsDone.textContent = "Done researching";
  resetRing();
  researchScreen.classList.add("open");
  researchTimerId = setInterval(() => {
    researchLeft -= 1;
    if (researchLeft <= 0) {
      rsTime.textContent = "0:00";
      rsProg.style.strokeDashoffset = 0;
      clearInterval(researchTimerId);
      researchTimerId = null;
      doneSound();
      setTimeout(enterReady, 1200);
      return;
    }
    if (researchLeft <= 5) tickSound();
    rsTime.textContent = fmt(researchLeft);
    rsProg.style.strokeDashoffset = RING_C * (researchLeft / researchTotal);
  }, 1000);
}

// The in-between screen: research done, speech up next.
function enterReady() {
  clearInterval(researchTimerId);
  researchTimerId = null;
  researchPhase = "ready";
  researchScreen.classList.add("done");
  rsTime.textContent = fmt(settings.speechMin * 60);
  document.getElementById("rsCaption").textContent = "Research done.";
  document.getElementById("rsSub").textContent =
    "Up next: " + settings.speechMin + " min to speak.";
  rsDone.textContent = "I'm ready to speak";
  speakLabel();
}

function finishResearch() {
  clearInterval(researchTimerId);
  researchTimerId = null;
  researchScreen.classList.remove("open");
  speakLabel();
}

// The speaking phase: the speech countdown runs inside the same circle.
function startSpeakingPhase() {
  researchPhase = "speaking";
  researchTotal = settings.speechMin * 60;
  researchLeft = researchTotal;
  researchScreen.classList.remove("done");
  document.getElementById("rsLabel").textContent = "Speaking";
  document.getElementById("rsCaption").textContent = "Speak.";
  rsDone.textContent = "Done speaking";
  rsTime.classList.remove("warn");
  rsTime.textContent = fmt(researchLeft);
  resetRing();
  researchTimerId = setInterval(() => {
    researchLeft -= 1;
    if (researchLeft <= 0) {
      clearInterval(researchTimerId);
      researchTimerId = null;
      researchPhase = "finished";
      rsTime.textContent = "0:00";
      rsProg.style.strokeDashoffset = 0;
      document.getElementById("rsCaption").textContent = "Time's up.";
      rsDone.textContent = "Done";
      doneSound();
      return;
    }
    if (researchLeft <= 5) tickSound();
    rsTime.classList.toggle("warn", researchLeft <= 10);
    rsTime.textContent = fmt(researchLeft);
    rsProg.style.strokeDashoffset = RING_C * (researchLeft / researchTotal);
  }, 1000);
}

rsDone.onclick = () => {
  if (researchPhase === "timing") {
    landSound();
    enterReady();
  } else if (researchPhase === "ready") {
    startSpeakingPhase();
  } else {
    // "Done speaking" mid-run or "Done" after time's up: back to the main screen.
    finishResearch();
  }
};
rsClose.onclick = () => finishResearch();

// In Deep research the button runs the full research flow every time;
// in Random topic it opens the same circle screen straight in the speaking phase.
timerBtn.onclick = () => {
  if (spinning) return;
  catWrap.classList.remove("open");
  if (mode === "research") { openResearch(); return; }
  rsTopic.textContent = PROMPTS[promptIndex];
  researchScreen.classList.add("open");
  startSpeakingPhase();
};

// On load, show a random topic instantly with no spin.
promptIndex = Math.floor(Math.random() * PROMPTS.length);
wordEl.textContent = PROMPTS[promptIndex];

// Dev hook: ?dev=research|ready|speaking|settings force-opens a screen for layout checks.
const devScreen = new URLSearchParams(location.search).get("dev");
if (devScreen === "research") { setMode("research"); openResearch(); }
else if (devScreen === "ready") { setMode("research"); openResearch(); enterReady(); }
else if (devScreen === "speaking") { rsTopic.textContent = PROMPTS[promptIndex]; researchScreen.classList.add("open"); startSpeakingPhase(); }
else if (devScreen === "settings") { overlay.classList.add("open"); }
</script>
</body>
</html>
